<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go-algorand benchmark trends</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --fg: #1a1a1a; --muted: #6a6a6a; --line: #d8d8d4;
    --panel: #ffffff; --accent: #2f6f4f; --warn: #a33;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #e8e8e6; --muted: #9a9a96; --line: #32343a;
            --panel: #1d1f23; --accent: #69b58c; --warn: #e07a7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 14px; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select, input { font: inherit; padding: 5px 7px; border: 1px solid var(--line);
                  border-radius: 5px; background: var(--bg); color: var(--fg); }
  select { max-width: 460px; }
  .toggles { display: flex; gap: 10px; }
  .toggles label { display: inline-flex; align-items: center; gap: 4px; margin: 0; color: var(--fg); }
  [hidden] { display: none !important; }
  svg { width: 100%; height: auto; display: block; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .axis { fill: var(--muted); font-size: 11px; }
  .line { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .dot { fill: var(--accent); }
  .dot.hit { fill: transparent; }
  .band { fill: var(--accent); opacity: .16; stroke: none; }
  .rule { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .rulelabel { fill: var(--muted); font-size: 10px; }
  .sentinel { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
  .dot.hit { cursor: pointer; }
  .tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--fg);
         border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12px;
         box-shadow: 0 4px 14px rgba(0,0,0,.18); opacity: 0; transition: opacity .1s; max-width: 320px; }
  .tip b { font-weight: 600; }
  .tip .delta.up { color: var(--warn); }
  .tip .delta.down { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .meta a { color: var(--accent); }
  #desc { margin: 0 0 8px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>go-algorand benchmark trends</h1>
  <p class="sub" id="sub">loading...</p>

  <div class="panel">
    <div class="controls">
      <div>
        <label for="bench">benchmark</label>
        <select id="bench"></select>
      </div>
      <div>
        <label for="metric">metric</label>
        <select id="metric"></select>
      </div>
      <div>
        <label for="filter">name filter</label>
        <input id="filter" type="search" placeholder="e.g. TxHandler" size="18">
      </div>
      <div>
        <label for="order">order by</label>
        <select id="order">
          <option value="commit">commit date</option>
          <option value="time">run date</option>
        </select>
      </div>
      <div>
        <label for="group">repeats</label>
        <label style="color: var(--fg)"><input id="group" type="checkbox" checked> combine</label>
      </div>
      <div id="kinds" hidden>
        <label>show</label>
        <div class="toggles"></div>
      </div>
      <div id="overlay" hidden>
        <label for="sentinel">noise sentinel</label>
        <label style="color: var(--fg)"><input id="sentinel" type="checkbox"> overlay</label>
      </div>
      <div id="runners" hidden>
        <label for="runner">runner</label>
        <select id="runner"></select>
      </div>
    </div>
  </div>

  <div class="panel">
    <p class="meta" id="desc"></p>
    <div id="chart"></div>
    <p class="meta" id="chartmeta"></p>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
const $ = id => document.getElementById(id);
const tip = $("tip");
let DATA;

const UNITS = {
  "ns/op":     v => v >= 1e9 ? (v/1e9).toFixed(2)+" s"  : v >= 1e6 ? (v/1e6).toFixed(2)+" ms"
                  : v >= 1e3 ? (v/1e3).toFixed(2)+" µs" : v.toFixed(1)+" ns",
  "B/op":      v => v >= 1e6 ? (v/1e6).toFixed(2)+" MB" : v >= 1e3 ? (v/1e3).toFixed(2)+" kB" : v+" B",
  "allocs/op": v => String(v),
};
const fmt = (v, unit) => v == null ? "-" : (UNITS[unit] || (x => x.toPrecision(4)))(v);
const median = xs => {
  const a = [...xs].sort((p, q) => p - q);
  return a.length % 2 ? a[(a.length - 1) / 2] : (a[a.length / 2 - 1] + a[a.length / 2]) / 2;
};
const runnerOf = s => s.tags.find(t => t.startsWith("runner:")) || "runner:?";
const goOf = s => s.tags.find(t => /^go\d/.test(t)) || "";
// The sentinel series come from a benchmark that does not depend on go-algorand
// (patches/add-noise-sentinel.sh): when they move, the machine did.
const SENTINEL = "BenchmarkNoiseSentinelHash";
const UPSTREAM = "https://github.com/algorand/go-algorand";

// A session is a release, a nightly or a range point (a commit between two
// nightlies, from the range workflow); the toggles pick which kinds to plot.
// The runner select only appears once more than one machine has contributed,
// since points from different hardware never belong on one line.
const KINDS = { release: "releases", nightly: "nightlies", range: "range points" };
const kindOf = s => s.tags.find(t => t in KINDS);
// Ordered by when the commit was made (a tag measured late still lands where
// it belongs in history) or by when the session was recorded, which is the
// order to read the noise sentinel in.
const sortKey = s => $("order").value === "commit" ? (s.commit_time || s.time) + " " + s.time : s.time;
function visibleSessions() {
  const kinds = new Set([...$("kinds").querySelectorAll("input:checked")].map(i => i.value));
  const runner = $("runner").value;
  return DATA.sessions.map((s, i) => i).filter(i => {
    const s = DATA.sessions[i];
    const kind = kindOf(s);
    return (!kind || kinds.has(kind)) && (!runner || runnerOf(s) === runner);
  }).sort((a, b) => sortKey(DATA.sessions[a]) < sortKey(DATA.sessions[b]) ? -1 : 1);
}

// One x position per commit per machine. The repeats of a set (RUNS=3) are
// separate benchspotter sessions of the same commit, so they belong on one
// point: the line is their median, the band their range. -count=4 is a level
// below that again, already reduced to a median per session at build time.
function groups() {
  const idx = visibleSessions();
  if (!$("group").checked) {
    return idx.map(i => ({ label: DATA.sessions[i].name, idx: [i] }));
  }
  const out = [], seen = new Map();
  for (const i of idx) {
    const s = DATA.sessions[i], key = s.commit + "|" + runnerOf(s);
    if (!seen.has(key)) { seen.set(key, { label: s.name, idx: [] }); out.push(seen.get(key)); }
    seen.get(key).idx.push(i);
  }
  return out;
}

function draw() {
  const name = $("bench").value, unit = $("metric").value;
  const values = (DATA.series[name] || {})[unit] || [];
  const ranges = ((DATA.ranges || {})[name] || {})[unit] || [];
  const points = [];
  for (const g of groups()) {
    const vs = g.idx.map(i => values[i]).filter(v => v != null);
    if (!vs.length) continue;
    // The line is the median of the run medians; the band is the full range of
    // every repeat in every run, since most of the noise is inside a process.
    const rs = g.idx.map(i => ranges[i]).filter(Boolean);
    const lo = rs.length ? Math.min(...rs.map(r => r[0])) : Math.min(...vs);
    const hi = rs.length ? Math.max(...rs.map(r => r[1])) : Math.max(...vs);
    const n = rs.length ? rs.reduce((a, r) => a + r[2], 0) : vs.length;
    points.push({ g, v: median(vs), lo, hi, n, runs: vs.length });
  }
  // Sentinel overlay: the sentinel's relative movement, scaled to start where
  // this series starts. A step both lines take is the runner.
  const showSentinel = $("sentinel").checked && name !== SENTINEL && (DATA.series[SENTINEL] || {})[unit];
  if (showSentinel) {
    const sv = DATA.series[SENTINEL][unit];
    let base = null;
    for (const p of points) {
      const vs = p.g.idx.map(i => sv[i]).filter(v => v != null);
      p.s = vs.length ? median(vs) : null;
      if (base == null && p.s != null) base = { s: p.s, v: p.v };
    }
    for (const p of points) p.s = p.s == null || !base ? null : p.s / base.s * base.v;
  }
  const chart = $("chart");

  if (points.length < 2) {
    // One night is one point: the repeats of a commit combine. A fresh store
    // draws nothing until a second commit has been benchmarked.
    chart.innerHTML = `<p class="empty">${points.length ? "only one point so far" : "no sessions"} ` +
      `with this benchmark and these tags; a trend needs two</p>`;
    $("chartmeta").textContent = "";
    return;
  }

  const W = 1060, H = 380, L = 70, R = 16, T = 16, B = 64;
  const ys = points.flatMap(p => showSentinel && p.s != null ? [p.lo, p.hi, p.s] : [p.lo, p.hi]);
  const lo = Math.min(...ys), hi = Math.max(...ys);
  // Always leave headroom, and never a zero-height band for a flat series.
  const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.05 || 1;
  const y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const px = k => L + k * (W - L - R) / (points.length - 1);
  const py = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));

  const parts = [], ticks = 5;
  for (let t = 0; t <= ticks; t++) {
    const v = y0 + (y1 - y0) * t / ticks, y = py(v);
    parts.push(`<line class="grid" x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}"/>`);
    parts.push(`<text class="axis" x="${L - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end">${fmt(v, unit)}</text>`);
  }

  const step = Math.ceil(points.length / 12);
  points.forEach((p, k) => {
    if (k % step) return;
    parts.push(`<text class="axis" x="${px(k).toFixed(1)}" y="${H - B + 20}" text-anchor="end"
      transform="rotate(-35 ${px(k).toFixed(1)} ${H - B + 20})">${p.g.label}</text>`);
  });

  // The band is the spread of every repeat in every run, which is the yardstick
  // for whether a step between two points means anything.
  if (points.some(p => p.n > 1)) {
    const top = points.map((p, k) => `${k ? "L" : "M"}${px(k).toFixed(1)},${py(p.hi).toFixed(1)}`).join("");
    const bottom = points.slice().reverse()
      .map((p, k) => `L${px(points.length - 1 - k).toFixed(1)},${py(p.lo).toFixed(1)}`).join("");
    parts.push(`<path class="band" d="${top}${bottom}Z"/>`);
  }

  // A rule where the Go toolchain that built the code changed: every series
  // tends to step there at once, and that is the compiler, not go-algorand.
  points.forEach((p, k) => {
    if (!k) return;
    const go = goOf(DATA.sessions[p.g.idx[0]]), prev = goOf(DATA.sessions[points[k - 1].g.idx[0]]);
    if (!go || !prev || go === prev) return;
    const x = px(k).toFixed(1);
    parts.push(`<line class="rule" x1="${x}" y1="${T}" x2="${x}" y2="${H - B}"/>`);
    parts.push(`<text class="rulelabel" x="${x}" y="${T + 10}" dx="3">${go}</text>`);
  });
  if (showSentinel) {
    const d = points.map((p, k) => p.s == null ? "" : `${k && points[k - 1].s != null ? "L" : "M"}${px(k).toFixed(1)},${py(p.s).toFixed(1)}`).join("");
    parts.push(`<path class="sentinel" d="${d}"/>`);
  }
  parts.push(`<path class="line" d="${points.map((p, k) => `${k ? "L" : "M"}${px(k).toFixed(1)},${py(p.v).toFixed(1)}`).join("")}"/>`);
  points.forEach((p, k) => {
    parts.push(`<circle class="dot" cx="${px(k).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="2.5"/>`);
    parts.push(`<circle class="dot hit" cx="${px(k).toFixed(1)}" cy="${py(p.v).toFixed(1)}" r="10" data-k="${k}"/>`);
  });

  chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${name} ${unit}">${parts.join("")}</svg>`;

  const first = points[0], last = points[points.length - 1];
  const change = ((last.v - first.v) / first.v) * 100;
  const sessions = points.reduce((n, p) => n + p.runs, 0);
  $("chartmeta").textContent =
    `${points.length} points (${sessions} sessions), ${fmt(first.v, unit)} at ${first.g.label}` +
    ` to ${fmt(last.v, unit)} at ${last.g.label} (${change >= 0 ? "+" : ""}${change.toFixed(1)}%)`;

  chart.querySelectorAll(".hit").forEach(c => {
    c.addEventListener("mouseenter", () => {
      const k = +c.dataset.k, p = points[k], s = DATA.sessions[p.g.idx[0]];
      const prev = k ? points[k - 1].v : null;
      const d = prev == null ? null : ((p.v - prev) / prev) * 100;
      const spread = p.n > 1 ? ((p.hi - p.lo) / p.v) * 100 : null;
      tip.innerHTML = `<b>${p.g.label}</b> ${s.commit}<br>` +
        (s.commit_time ? `committed ${s.commit_time.slice(0, 16).replace("T", " ")}, ` : "") +
        `measured ${s.time.slice(0, 16).replace("T", " ")}<br>` +
        `${fmt(p.v, unit)}` +
        (d == null ? "" : ` <span class="delta ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : ""}${d.toFixed(1)}%</span>`) +
        (spread == null ? "" : `<br><span class="meta">${p.n} samples in ${p.runs} run${p.runs > 1 ? "s" : ""}, ${fmt(p.lo, unit)} to ${fmt(p.hi, unit)}, spread ${spread.toFixed(1)}%</span>`) +
        (p.s == null || !k || points[k - 1].s == null ? "" : `<br><span class="meta">sentinel ${((p.s / points[k - 1].s - 1) * 100).toFixed(1)}% vs previous point</span>`) +
        `<br><span class="meta">${s.tags.filter(t => !/^run\d+$/.test(t)).join(", ")}<br>${s.cpu}, ${s.platform}</span>` +
        (k ? `<br><span class="meta">click: upstream changes since ${points[k - 1].g.label}</span>` : "");
      tip.style.opacity = 1;
    });
    // The tooltip cannot take clicks, so the dot does: the compare view between
    // the previous point's commit and this one is the list of PRs that could
    // have caused a step.
    c.addEventListener("click", () => {
      const k = +c.dataset.k;
      if (!k) return;
      const from = DATA.sessions[points[k - 1].g.idx[0]].commit, to = DATA.sessions[points[k].g.idx[0]].commit;
      window.open(`${UPSTREAM}/compare/${from}...${to}`, "_blank", "noopener");
    });
    c.addEventListener("mousemove", e => {
      tip.style.left = Math.min(e.clientX + 14, innerWidth - 340) + "px";
      tip.style.top = (e.clientY + 14) + "px";
    });
    c.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
  });
}

// Series are keyed "package: BenchmarkName", so the filter matches on either
// and the select groups by package.
const pkgOf = n => n.split(": ", 1)[0];
const shortOf = n => n.slice(pkgOf(n).length + 2);
function fillBenchmarks() {
  const q = $("filter").value.toLowerCase();
  const keep = Object.keys(DATA.series).filter(n => n.toLowerCase().includes(q));
  const current = $("bench").value;
  const retired = new Set(DATA.retired || []);
  const groups = new Map();
  for (const n of keep) (groups.get(pkgOf(n)) || groups.set(pkgOf(n), []).get(pkgOf(n))).push(n);
  $("bench").innerHTML = [...groups].map(([pkg, ns]) => `<optgroup label="${pkg}">` + ns.map(n =>
    `<option value="${n}"${n === current ? " selected" : ""}>${shortOf(n)}${retired.has(n) ? "  (no longer recorded)" : ""}</option>`).join("") + `</optgroup>`).join("");
  if (!keep.includes(current) && keep.length) $("bench").value = keep[0];
  fillMetrics();
  describe();
}
function describe() {
  const n = $("bench").value, pkg = pkgOf(n), note = (DATA.notes || {})[n];
  $("desc").innerHTML = n ? `<b>${shortOf(n)}</b> in <a href="${UPSTREAM}/tree/master/${pkg}" target="_blank" rel="noopener">${pkg}</a>` +
    (note ? `: ${note}` : "") : "";
}

function fillMetrics() {
  const units = Object.keys(DATA.series[$("bench").value] || {});
  const current = $("metric").value;
  $("metric").innerHTML = units.map(u => `<option${u === current ? " selected" : ""}>${u}</option>`).join("");
  if (!units.includes(current) && units.length) $("metric").value = units.includes("ns/op") ? "ns/op" : units[0];
}

fetch("data.json").then(r => r.json()).then(data => {
  DATA = data;
  $("sub").innerHTML =
    `${data.sessions.length} sessions, ${Object.keys(data.series).length} benchmarks, ` +
    `built ${data.generated.slice(0, 16).replace("T", " ")} UTC. ` +
    `Hover a point for the commit and the machine that ran it.`;

  // One toggle per kind of session present; pointless until there are two kinds.
  const kinds = [...new Set(data.sessions.map(kindOf).filter(Boolean))].sort();
  $("kinds").querySelector(".toggles").innerHTML = kinds.map(k =>
    `<label><input type="checkbox" value="${k}" checked> ${KINDS[k]}</label>`).join("");
  $("kinds").hidden = kinds.length < 2;
  $("kinds").addEventListener("change", draw);
  $("overlay").hidden = !(data.series[SENTINEL] || {})["ns/op"];
  $("sentinel").addEventListener("change", draw);

  const runners = [...new Set(data.sessions.map(runnerOf))].sort();
  $("runner").innerHTML = runners.map(r => `<option>${r}</option>`).join("");
  // Default to the machine that produced the newest session, the live series.
  $("runner").value = runnerOf(data.sessions[data.sessions.length - 1]);
  $("runners").hidden = runners.length < 2;
  $("runner").addEventListener("change", draw);

  fillBenchmarks();
  const start = Object.keys(data.series).find(n => n.endsWith(": BenchmarkTxn"));
  if (start) $("bench").value = start;
  fillMetrics();
  describe();
  draw();

  $("filter").addEventListener("input", () => { fillBenchmarks(); draw(); });
  $("bench").addEventListener("change", () => { fillMetrics(); describe(); draw(); });
  $("metric").addEventListener("change", draw);
  $("order").addEventListener("change", draw);
  $("group").addEventListener("change", draw);
  addEventListener("resize", draw);
}).catch(e => { $("sub").textContent = "failed to load data.json: " + e; });
</script>
</body>
</html>
