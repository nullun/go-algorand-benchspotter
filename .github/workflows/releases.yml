name: releases

# Benchmarks any go-algorand *-stable tag that has no release session yet, and
# commits the sessions to this repo. The master workflow tracks master; this one is
# what puts the release points on the trend site. It runs every hour, and a
# cheap first job compares upstream's tags with the store; most hours there is
# nothing new and the run ends there. run-sweep.sh does the skipping too
# (SKIP_IF_DONE), so a dispatch with nothing to do costs a checkout.
#
# MAX_TAGS is 1: one tag per run, oldest first. With the 67-name set a tag is
# three sessions of ten minutes or more each, and the results are committed
# only when the run ends, so a run that hits the job time limit loses every
# tag it measured. A backlog clears one tag an hour.

on:
  schedule:
    # Every hour, at 47 past, half an hour off the master check. Upstream
    # publishes releases around 14:30 UTC, so a tag is measured the same day.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'space-separated tags to benchmark (default: every unmeasured stable tag)'
        default: ''
      max_tags:
        description: most tags to benchmark in this run, 0 for no limit
        default: '1'
      runs:
        description: sessions to record per tag
        default: '3'
      force:
        description: benchmark even if the tag already has a release session
        type: boolean
        default: false

concurrency:
  # Shared with master: never two benchmark runs on one machine at the same time.
  group: benchmark-runner
  cancel-in-progress: false

jobs:
  # Is there a stable tag without a release session? Tags older than the oldest
  # measured one are ignored: they predate the go.mod toolchain directive and
  # run-sweep.sh would skip them anyway. A dispatch always proceeds.
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of main when this job starts, not the sha the run was
          # triggered at: a run queued behind a long benchmark would otherwise
          # read a store from before that benchmark pushed, measure the same
          # commit again, and have its push rejected.
          ref: main
      - id: check
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DISPATCH" = true ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          upstream="$(git ls-remote --tags https://github.com/algorand/go-algorand.git 'refs/tags/*-stable' \
            | cut -f2 | sed 's|^refs/tags/||; s|\^{}$||' | sort -u)"
          [ -n "$upstream" ] || { echo "could not read tags from upstream" >&2; exit 1; }
          # cat fails when the store is empty, which is a backlog of every tag, not an error.
          done="$({ cat .benchspotter/sessions/*/meta.json 2>/dev/null || true; } \
            | jq -r -s '[.[] | select(.tags | index("release")) | .name] | unique[]' | sort)"
          oldest="$(echo "$done" | sort -V | head -1)"
          # A tag is due if it has no session and is not older than the oldest measured tag.
          todo=""
          for t in $(comm -23 <(echo "$upstream") <(echo "$done")); do
            if [ -z "$oldest" ] || [ "$(printf '%s\n%s\n' "$oldest" "$t" | sort -V | head -1)" = "$oldest" ]; then
              todo="$todo $t"
            fi
          done
          if [ -z "$todo" ]; then
            echo "every stable tag since $oldest has a release session"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "unmeasured stable tags:"; echo "$todo"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  sweep:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    # A GitHub-hosted job is killed at 6 hours whatever this says, and the results
    # are only committed after the last tag, so a run that overruns loses every
    # session it measured. MAX_TAGS keeps a run well inside the limit and
    # SKIP_IF_DONE picks the backlog up again tomorrow.
    timeout-minutes: 330
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of main when this job starts, not the sha the run was
          # triggered at: a run queued behind a long benchmark would otherwise
          # read a store from before that benchmark pushed, measure the same
          # commit again, and have its push rejected.
          ref: main

      - uses: ./.github/actions/bench-setup

      - name: Benchmark
        env:
          RUNS: ${{ github.event.inputs.runs || '3' }}
          RUNNER: runner:${{ vars.BENCH_RUNNER || 'github-hosted' }}
          SKIP_IF_DONE: ${{ github.event.inputs.force == 'true' && '0' || '1' }}
          # Through the environment, not interpolated into the script body: a
          # dispatch input is attacker-controlled shell otherwise.
          TAGS: ${{ github.event.inputs.tags }}
          MAX_TAGS: ${{ github.event.inputs.max_tags || '1' }}
        # Unquoted on purpose: TAGS is a space-separated list, empty means "all".
        run: ./run-sweep.sh $TAGS

      - name: Commit results
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .benchspotter
          if git diff --cached --quiet; then
            echo "no new sessions"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "releases: $(date -u +%Y-%m-%d) go-algorand stable tags"
          # Same reason: main may have moved while we ran.
          git pull --rebase --quiet origin main
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pages:
    needs: sweep
    if: needs.sweep.outputs.committed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.sweep.outputs.sha }}
