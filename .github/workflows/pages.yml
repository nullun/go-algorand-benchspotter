name: pages

# Builds site/dist from the committed sessions and publishes it to GitHub Pages.
# Needs Pages enabled for the repo with "GitHub Actions" as the source.

on:
  push:
    branches: [main]
    paths:
      - '.benchspotter/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: >
          Commit to build the site from. A caller that has just pushed results
          must pass the pushed sha: this run's github.sha was fixed before that
          commit existed, so the default checkout builds the tree without it.
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Empty ref means github.sha, the checkout default.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v5
      - run: uv run site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
