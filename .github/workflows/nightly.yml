name: nightly

# Benchmarks whatever algorand/go-algorand master points at, once a night, and
# commits the session to this repo. go-algorand itself needs no changes: this
# workflow clones it read-only and any source edits it needs (see patches/) are
# applied to that throwaway clone.

on:
  schedule:
    # 02:00 UTC. Pick a time the runner is otherwise idle: benchmark numbers are
    # only comparable night to night if the machine is.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: go-algorand ref to benchmark
        default: origin/master
      runs:
        description: sessions to record
        default: '3'
      force:
        description: benchmark even if this commit already has a nightly session
        type: boolean
        default: false

concurrency:
  # Never two benchmark runs on one machine at the same time.
  group: benchmark-runner
  cancel-in-progress: false

jobs:
  bench:
    # Set the BENCH_RUNNER repository variable to a self-hosted label. On a
    # GitHub-hosted runner the neighbours on the same host move the numbers by
    # more than most real regressions do, so hosted results are worth little
    # beyond "did it still build and run".
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          # The go.mod toolchain directive of the ref under test wins anyway
          # (TOOLCHAIN=pinned), this is just a bootstrap Go.
          cache: false

      - name: Settings
        run: |
          # Outside the workspace, so a self-hosted runner keeps the go-algorand
          # clone and the Go build cache between nights. The first run is the slow one.
          echo "CHECKOUT=$HOME/.cache/go-algorand-bench/checkout" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/bin"

      - name: Install jq
        run: |
          command -v jq && exit 0
          if command -v brew; then brew install jq
          else sudo apt-get update && sudo apt-get install -y jq; fi

      - name: Build benchspotter
        run: |
          # `go install @latest` fails on a replace directive in its go.mod.
          src="$RUNNER_TEMP/benchspotter"
          rm -rf "$src"
          git clone --quiet --depth 1 https://github.com/MichaelMure/benchspotter "$src"
          (cd "$src" && go build -o "$HOME/.local/bin/benchspotter" .)
          benchspotter --version

      - name: Benchmark
        env:
          RUNS: ${{ github.event.inputs.runs || '3' }}
          RUNNER: runner:${{ vars.BENCH_RUNNER || 'github-hosted' }}
          SKIP_IF_DONE: ${{ github.event.inputs.force == 'true' && '0' || '1' }}
        run: ./run-nightly.sh "${{ github.event.inputs.ref || 'origin/master' }}"

      - name: Commit results
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .benchspotter
          if git diff --cached --quiet; then
            echo "no new sessions"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "nightly: $(date -u +%Y-%m-%d) go-algorand $(git -C "$CHECKOUT" rev-parse --short HEAD)"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the site
  # rebuild has to be called from here rather than left to pages.yml's push trigger.
  pages:
    needs: bench
    if: needs.bench.outputs.committed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
