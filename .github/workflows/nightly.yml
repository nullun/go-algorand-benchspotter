name: nightly

# Benchmarks whatever algorand/go-algorand master points at and commits the
# session to this repo. It runs every hour, and a cheap first job asks whether
# master has moved since the last session; most hours it has not, and the run
# ends there in seconds without touching the benchmark runner. go-algorand
# itself needs no changes: this workflow clones it read-only and any source
# edits it needs (see patches/) are applied to that throwaway clone.
#
# The sessions keep the tag "nightly", which is the kind the site and the step
# check know; it now means "a master commit", one point per merge.

on:
  schedule:
    # Every hour, five past. The check job is what runs hourly; the benchmark
    # job only when master moved. Numbers are only comparable point to point
    # if the runner is otherwise idle whenever that happens, which on a
    # self-hosted machine means a machine that does nothing else.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: go-algorand ref to benchmark
        default: origin/master
      runs:
        description: sessions to record
        default: '3'
      force:
        description: benchmark even if this commit already has a nightly session
        type: boolean
        default: false
      profiles:
        description: >
          extra benchspotter profiles to record, space-separated (cpu mem block
          mutex). Megabytes per session, so only for a run you will drill into.
        default: ''

concurrency:
  # Never two benchmark runs on one machine at the same time.
  group: benchmark-runner
  cancel-in-progress: false

jobs:
  # Is there anything to do? Compares the sha master points at with the store,
  # without a go-algorand clone, a toolchain or benchspotter. A dispatch always
  # proceeds; run-nightly.sh applies the same check to an arbitrary ref anyway.
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$DISPATCH" = true ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sha="$(git ls-remote https://github.com/algorand/go-algorand.git refs/heads/master | cut -f1)"
          [ -n "$sha" ] || { echo "could not read master from upstream" >&2; exit 1; }
          if cat .benchspotter/sessions/*/meta.json \
               | jq -e -s --arg c "$sha" 'any(.[]; .git_commit == $c and (.tags | index("nightly")))' >/dev/null; then
            echo "master is $sha, already measured"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "master is $sha, no session yet"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  bench:
    needs: check
    if: needs.check.outputs.needed == 'true'
    # Set the BENCH_RUNNER repository variable to a self-hosted label. On a
    # GitHub-hosted runner the neighbours on the same host move the numbers by
    # more than most real regressions do, so hosted results are worth little
    # beyond "did it still build and run".
    runs-on: ${{ vars.BENCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    permissions:
      contents: write
      issues: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/bench-setup

      - name: Benchmark
        env:
          RUNS: ${{ github.event.inputs.runs || '3' }}
          RUNNER: runner:${{ vars.BENCH_RUNNER || 'github-hosted' }}
          SKIP_IF_DONE: ${{ github.event.inputs.force == 'true' && '0' || '1' }}
          # Through the environment, not interpolated into the script body: a
          # dispatch input is attacker-controlled shell otherwise.
          REF: ${{ github.event.inputs.ref || 'origin/master' }}
          PROFILES: ${{ github.event.inputs.profiles }}
        run: ./run-nightly.sh "$REF"

      # Tonight's point against the previous nightlies on this runner. The
      # report goes to the job summary either way; a step also opens an issue.
      # Exit 3 is "stepped", anything else non-zero is the script failing.
      - uses: astral-sh/setup-uv@v5
      - name: Check for steps
        id: steps
        run: |
          set +e
          uv run lib/check-steps.py --fail-on-step > "$RUNNER_TEMP/steps.md"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/steps.md" >> "$GITHUB_STEP_SUMMARY"
          case $rc in
            0) echo "stepped=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "stepped=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit $rc ;;
          esac

      - name: Open an issue for the step
        if: steps.steps.outputs.stepped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "step: $(date -u +%Y-%m-%d) go-algorand $(git -C "$CHECKOUT" rev-parse --short HEAD)" \
            --body-file "$RUNNER_TEMP/steps.md"

      - name: Commit results
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .benchspotter
          if git diff --cached --quiet; then
            echo "no new sessions"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "nightly: $(date -u +%Y-%m-%d) go-algorand $(git -C "$CHECKOUT" rev-parse --short HEAD)"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"
          # The site build has to be pointed at this commit by hand: it is created
          # after the run's own github.sha was fixed, so a plain checkout in the
          # called workflow would build the tree from before tonight's results.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the site
  # rebuild has to be called from here rather than left to pages.yml's push trigger.
  pages:
    needs: bench
    if: needs.bench.outputs.committed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.bench.outputs.sha }}
