name: bench-setup
description: Go toolchain, jq, benchspotter and the shared go-algorand checkout path.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        # The go.mod toolchain directive of the ref under test wins anyway
        # (TOOLCHAIN=pinned), this is just a bootstrap Go.
        cache: false

    # The Go build cache and module cache (the go.mod toolchain downloads land
    # there too), for a hosted runner that starts empty: without it every run
    # compiles go-algorand's test packages cold, which was most of the gap to a
    # warm machine. Always saved under a fresh key and restored from the newest,
    # so it follows master. A self-hosted runner keeps ~/.cache anyway and the
    # step is a cheap no-op there.
    - uses: actions/cache@v4
      if: runner.environment == 'github-hosted'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-cache-${{ runner.os }}-${{ github.run_id }}
        restore-keys: go-cache-${{ runner.os }}-

    - name: Settings
      shell: bash
      run: |
        # Outside the workspace, so a self-hosted runner keeps the go-algorand
        # clone and the Go build cache between runs. The first run is the slow one.
        echo "CHECKOUT=$HOME/.cache/go-algorand-bench/checkout" >> "$GITHUB_ENV"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        mkdir -p "$HOME/.local/bin"

    - name: Install jq
      shell: bash
      run: |
        command -v jq && exit 0
        if command -v brew; then brew install jq
        else sudo apt-get update && sudo apt-get install -y jq; fi

    - name: Build benchspotter
      shell: bash
      run: |
        # `go install @latest` fails on a replace directive in its go.mod.
        src="$RUNNER_TEMP/benchspotter"
        rm -rf "$src"
        git clone --quiet --depth 1 https://github.com/MichaelMure/benchspotter "$src"
        (cd "$src" && go build -o "$HOME/.local/bin/benchspotter" .)
        benchspotter --version
